# .github/workflows/ci.yml

name: CI Pipeline # Название процесса, которое будет видно на GitHub

# Триггеры: когда запускать этот процесс
on:
  push:
    branches: [ "main", "master" ] # Запускать при пуше в main или master
  pull_request:
    branches: [ "main", "master" ] # Запускать при создании пул-реквеста

# Задачи (Jobs)
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Операционная система виртуальной машины (ubuntu, windows, macos)

    steps:
    # 1. Скачиваем код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем нужную версию языка (пример для Python 3.10)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Устанавливаем зависимости (пример для pip)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Убедись, что этот файл есть в репо, или удали эту строку

    # 4. Запускаем тесты или линтер (пример для pytest или flake8)
    - name: Run tests
      run: |
        pip install pytest
        pytest # Или любая другая команда для проверки кода, например: python -m pytest
