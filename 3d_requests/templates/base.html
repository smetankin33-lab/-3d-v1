<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}3D Печать{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b10;
            --surface: #12141c;
            --surface2: #1a1d29;
            --border: #2d3548;
            --accent: #00f0ff;
            --accent2: #7b2fff;
            --accent3: #ff00e6;
            --danger: #ff4757;
            --warn: #ffa502;
            --text: #e8eaed;
            --text-dim: #9aa0a6;
            --font: 'Exo 2', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --glow: 0 0 20px rgba(0,240,255,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: linear-gradient(135deg, #0a0b10 0%, #0d1117 100%);
            color: var(--text);
            min-height: 100vh;
        }
        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,240,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 4s ease-in-out infinite;
        }
        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,11,16,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            box-shadow: 0 4px 30px rgba(0,240,255,0.1);
        }
        .nav-logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }
        .nav-logo span { 
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
        }
        .nav-links { display: flex; gap: 0.5rem; }
        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .nav-links a:hover { 
            color: var(--accent); 
            background: var(--surface2);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0,240,255,0.2);
        }
        .main { position: relative; z-index: 1; }
        .flash-messages { padding: 1rem 2rem 0; max-width: 900px; margin: 0 auto; }
        .flash {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .flash.error { 
            background: rgba(255,71,87,0.15); 
            border: 1px solid rgba(255,71,87,0.5); 
            color: #ff6b7a;
            box-shadow: 0 0 20px rgba(255,71,87,0.2);
        }
        .flash.success { 
            background: rgba(0,240,255,0.15); 
            border: 1px solid rgba(0,240,255,0.5); 
            color: #00f0ff;
            box-shadow: 0 0 20px rgba(0,240,255,0.2);
        }
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: white;
            box-shadow: var(--glow);
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 0 40px rgba(0,240,255,0.5);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { 
            color: var(--accent); 
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0,240,255,0.2);
        }
        .btn-danger { 
            background: rgba(255,71,87,0.15); 
            color: #ff6b7a; 
            border: 1px solid rgba(255,71,87,0.4);
        }
        .btn-danger:hover { 
            background: rgba(255,71,87,0.3);
            box-shadow: 0 0 20px rgba(255,71,87,0.3);
        }
        .btn-success { 
            background: rgba(0,240,255,0.15); 
            color: #00f0ff; 
            border: 1px solid rgba(0,240,255,0.4);
        }
        .btn-success:hover { 
            background: rgba(0,240,255,0.3);
            box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }
        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 40px rgba(0,240,255,0.15);
        }
        /* Status badge */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--mono);
            box-shadow: 0 0 10px rgba(0,240,255,0.2);
        }
        @media print {
            nav, .no-print { display: none !important; }
            body { background: white; color: #000; }
            body::before { display: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav>
    <a href="/" class="nav-logo">◈ <span>3D</span>PRINT</a>
    <div class="nav-links">
        <a href="/">Новая заявка</a>
        <a href="/track">Отследить</a>
    </div>
</nav>
<div class="main">
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
