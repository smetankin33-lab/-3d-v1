<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}3D Печать{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F0F9FF;
            --surface: #FFFFFF;
            --surface2: #E0F2FE;
            --border: #BAE6FD;
            --accent: #0284C7;
            --accent2: #0EA5E9;
            --accent3: #14B8A6;
            --danger: #EF4444;
            --warn: #F59E0B;
            --text: #0C4A6E;
            --text-dim: #64748B;
            --font: 'Exo 2', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        /* Grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,11,15,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .nav-logo {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 0.5rem; }
        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: var(--text); background: var(--surface2); }
        .main { position: relative; z-index: 1; }
        .flash-messages { padding: 1rem 2rem 0; max-width: 900px; margin: 0 auto; }
        .flash {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .flash.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #FCA5A5; }
        .flash.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #6EE7B7; }
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.4rem;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            color: white;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,212,255,0.4); }
        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
        .btn-danger { background: rgba(239,68,68,0.15); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
        .btn-danger:hover { background: rgba(239,68,68,0.3); }
        .btn-success { background: rgba(16,185,129,0.15); color: #6EE7B7; border: 1px solid rgba(16,185,129,0.3); }
        .btn-success:hover { background: rgba(16,185,129,0.3); }
        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }
        /* Status badge */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--mono);
        }
        @media print {
            nav, .no-print { display: none !important; }
            body { background: white; color: #000; }
            body::before { display: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav>
    <a href="/" class="nav-logo">◈ <span>3D</span>PRINT</a>
    <div class="nav-links">
        <a href="/">Новая заявка</a>
        <a href="/track">Отследить</a>
    </div>
</nav>
<div class="main">
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
    </div>
    {% block content %}{% endblock %}
</div>
</body>
</html>
